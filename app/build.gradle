plugins { id 'com.android.application' }
android {
    namespace 'ir.mehdieslami.clock'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.mehdieslami.clock'
        minSdk 31
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
        testInstrumentationRunner 'ir.mehdieslami.clock.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','javax.net.ssl.trustStore','javax.net.ssl.trustStorePassword'].each { key ->
                if (System.getProperty(key)) systemProperty key, System.getProperty(key)
            }
        }
    }
    if (System.getenv('CLOCK_KEYSTORE_FILE')) {
        signingConfigs {
            debug {
                storeFile file(System.getenv('CLOCK_KEYSTORE_FILE'))
                storePassword System.getenv('CLOCK_KEYSTORE_PASSWORD')
                keyAlias 'clock'
                keyPassword System.getenv('CLOCK_KEYSTORE_PASSWORD')
            }
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
